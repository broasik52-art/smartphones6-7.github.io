<!DOCTYPE html><html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Магазин смартфонов</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      margin: 0;
      padding: 20px;
    }h1 {
  text-align: center;
  margin-bottom: 20px;
}

/* Фильтр */
.filter-box {
  text-align: center;
  margin-bottom: 20px;
}

select, input {
  padding: 8px;
  border-radius: 5px;
  border: 1px solid #aaa;
}

/* Карточки */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 3px 6px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.03);
  box-shadow: 0 6px 14px rgba(0,0,0,0.18);
}

.card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 8px;
}

.price {
  font-weight: bold;
  margin: 5px 0;
}

.brand {
  color: #555;
  font-size: 14px;
}

/* Анимация появления */
.fade {
  animation: fadeIn 0.6s ease-in;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

  </style>
</head>
<body><h1>Простой магазин смартфонов</h1><div class="filter-box">
  <input type="text" id="search" placeholder="Поиск...">
  <select id="brandFilter">
    <option value="all">Все бренды</option>
    <option value="Falcon">Falcon</option>
    <option value="Orion">Orion</option>
    <option value="Nova">Nova</option>
  </select>
</div><div class="grid" id="productGrid"></div><script
